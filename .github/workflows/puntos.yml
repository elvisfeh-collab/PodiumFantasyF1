name: Calcular Puntos EFEH Tech

on:
  workflow_dispatch: 

jobs:
  run-logic:
    runs-on: ubuntu-latest
    
    steps:
      - name: Clonar repositorio (rama logic)
        uses: actions/checkout@v4
        with:
          ref: 'logic'

      - name: Inspeccionar estructura de archivos en la rama logic
        run: |
          echo "=== ÁRBOL DE ARCHIVOS EN LA RAMA LOGIC ==="
          find . -maxdepth 2 -not -path '*/.*'

      - name: Configurar entorno de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias necesarias
        run: |
          python -m pip install --upgrade pip
          pip install supabase pandas requests

      - name: Ejecutar motor de puntos
        run: python points_logic.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
